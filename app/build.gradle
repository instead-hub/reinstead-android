import de.undercouch.gradle.tasks.download.Download
import de.undercouch.gradle.tasks.download.Verify
import java.text.SimpleDateFormat

def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    namespace "ru.hugeping.reinstead"
    ndkVersion "21.4.7075529"
    defaultConfig {
        if (buildAsApplication) {
            applicationId "ru.hugeping.reinstead"
        }
        minSdkVersion 21
        compileSdk 34
        targetSdkVersion 34
        versionCode 9
        versionName "0.9"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
            // cmake {
            //     arguments "-DANDROID_APP_PLATFORM=android-21", "-DANDROID_STL=c++_static"
            //     // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            //     abiFilters 'arm64-v8a'
            // }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
            // cmake {
            //     path 'jni/CMakeLists.txt'
            // }
        }
    }
    lintOptions {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "ru.hugeping.reinstead.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

tasks.register("stamp") {
    doLast {
        new File("${projectDir}/src/main/assets/data", "stamp").text = "${new SimpleDateFormat('ddMMyyyyhhmmss').format(new Date())}"
    }
}
def ReinsteadBranch = 'opencode'
def SDL3 = '3.4.16'
def SDL3SHA256 = '7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68'
def ReinsteadArchive = file("$buildDir/reinstead-${ReinsteadBranch}.zip")
def SDL3Archive = file("$buildDir/SDL3-${SDL3}.tar.gz")

def downloadReinstead = tasks.register("downloadReinstead", Download) {
    src "https://github.com/instead-hub/reinstead/archive/refs/heads/${ReinsteadBranch}.zip"
    dest ReinsteadArchive
    overwrite true
    tempAndMove true
}

def downloadSDL3 = tasks.register("downloadSDL3", Download) {
    src "https://github.com/libsdl-org/SDL/releases/download/release-${SDL3}/SDL3-${SDL3}.tar.gz"
    dest SDL3Archive
    overwrite false
    onlyIf { !SDL3Archive.isFile() }
}

def verifySDL3 = tasks.register("verifySDL3", Verify) {
    dependsOn downloadSDL3
    src SDL3Archive
    algorithm 'SHA-256'
    checksum SDL3SHA256
}

tasks.register("downloadDependencies") {
    dependsOn downloadReinstead, verifySDL3
    doLast {
        copy {
            from zipTree(ReinsteadArchive)
            into 'jni/src/'
        }
        delete("jni/src/reinstead")
        file("jni/src/reinstead-${ReinsteadBranch}").renameTo(file('jni/src/reinstead'))

        delete("jni/SDL")
        copy {
            from tarTree(SDL3Archive)
            into 'jni/'
        }
        file("jni/SDL3-${SDL3}").renameTo(file('jni/SDL'))

        delete("src/main/assets/data")
        copy {
            from "jni/src/reinstead/data"
            into 'src/main/assets/data'
        }
        delete fileTree('src/main/assets/data/games') {
            include '**/autoscript*'
        }
        copy {
            from "config.lua"
            into 'src/main/assets/data/core/'
        }
        delete("src/main/assets/data/stead3/morph/morphs.mrd")
    }
}

preBuild.dependsOn stamp

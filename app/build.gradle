import java.text.SimpleDateFormat

def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    ndkVersion "21.4.7075529"
    defaultConfig {
        if (buildAsApplication) {
            applicationId "ru.hugeping.reinstead"
        }
        minSdkVersion 18
        compileSdk 34
        targetSdkVersion 34
        versionCode 9
        versionName "0.9"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-16"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
            // cmake {
            //     arguments "-DANDROID_APP_PLATFORM=android-16", "-DANDROID_STL=c++_static"
            //     // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            //     abiFilters 'arm64-v8a'
            // }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
            // cmake {
            //     path 'jni/CMakeLists.txt'
            // }
        }
    }
    lintOptions {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "ru.hugeping.reinstead.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

tasks.register("stamp") {
    doLast {
        new File("${projectDir}/src/main/assets/data", "stamp").text = "${new SimpleDateFormat('ddMMyyyyhhmmss').format(new Date())}"
    }
}
tasks.register("downloadDependencies") {
    def Reinstead = '0.8'
    def ReinsteadSHA256 = '8ceebbcc574dfb0bb7e19976534f05ccced305db195dd37f9513cbaae2527d7d'
    def SDL2 = '2.0.16'
    def SDL2SHA256 = '65be9ff6004034b5b2ce9927b5a4db1814930f169c4b2dae0a1e4697075f287b'
    doLast {
        download {
            src "https://github.com/instead-hub/reinstead/archive/${Reinstead}.zip"
            dest new File(buildDir, "reinstead-${Reinstead}.zip")
            overwrite true
        }
        verifyChecksum {
            src new File(buildDir, "reinstead-${Reinstead}.zip")
            algorithm 'SHA-256'
            checksum ReinsteadSHA256
        }
        download {
            src "https://www.libsdl.org/release/SDL2-${SDL2}.tar.gz"
            dest buildDir
        }
        verifyChecksum {
            src new File(buildDir, "SDL2-${SDL2}.tar.gz")
            algorithm 'SHA-256'
            checksum SDL2SHA256
        }
        copy {
            from zipTree("${buildDir}/reinstead-${Reinstead}.zip")
            into 'jni/src/'
        }
        delete("jni/src/reinstead")
        file("jni/src/reinstead-${Reinstead}").renameTo(file('jni/src/reinstead'))

        delete("jni/SDL")
        copy {
            from tarTree(resources.gzip("${buildDir}/SDL2-${SDL2}.tar.gz"))
            into 'jni/'
        }
        file("jni/SDL2-${SDL2}").renameTo(file('jni/SDL'))

        delete("src/main/assets/data")
        copy {
            from "jni/src/reinstead/data"
            into 'src/main/assets/data'
        }
        delete fileTree('src/main/assets/data/games') {
            include '**/autoscript*'
        }
        copy {
            from "config.lua"
            into 'src/main/assets/data/core/'
        }
        delete("src/main/assets/data/stead3/morph/morphs.mrd")
    }
}

preBuild.dependsOn stamp

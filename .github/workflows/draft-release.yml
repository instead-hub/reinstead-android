name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.9.1
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/34.0.0
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-34
          key: android-sdk-34-r28c-${{ runner.os }}-${{ hashFiles('app/build.gradle', 'app/jni/Application.mk', 'app/jni/src/Android.mk', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-sdk-34-r28c-${{ runner.os }}-

      - name: Cache SDL3 archive
        uses: actions/cache@v5
        with:
          path: app/build/SDL3-3.4.16.tar.gz
          key: sdl3-3.4.16-${{ runner.os }}-${{ hashFiles('app/build.gradle') }}
          restore-keys: |
            sdl3-3.4.16-${{ runner.os }}-

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager_bin=$(command -v sdkmanager || true)
          if [[ -z "$sdkmanager_bin" ]]; then
            sdkmanager_bin=$(ls -1d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "sdkmanager not found in PATH or in $ANDROID_SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi

          yes | "$sdkmanager_bin" --licenses > /dev/null || true
          "$sdkmanager_bin" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Secret RELEASE_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :app:downloadDependencies
          ./gradlew --stacktrace :app:assembleRelease

      - name: Prepare release assets
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -z "$tag" ]]; then
            echo "Release tag is empty" >&2
            exit 1
          fi

          for var in RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then
              echo "Secret $var is not set" >&2
              exit 1
            fi
          done

          version=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [[ -z "$version" ]]; then
            echo "versionName not found in app/build.gradle" >&2
            exit 1
          fi

          mkdir -p dist
          apk="reinstead-${version}.apk"
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$apksigner" sign \
            --ks "$RELEASE_KEYSTORE" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "dist/${apk}" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          verify_output=$("$apksigner" verify --print-certs "dist/${apk}")
          echo "$verify_output"
          fingerprint=$(echo "$verify_output" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          (
            cd dist
            sha256sum "$apk" > "$apk.sha256"
          )

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=Re:instead $tag" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          name: ${{ steps.release.outputs.name }}
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Draft build from ${{ github.sha }}.

            This build is signed with the Re:instead release key
            (certificate SHA-256: ${{ steps.release.outputs.fingerprint }}).
          files: |
            dist/*.apk
            dist/*.sha256

      - name: Remove keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"
